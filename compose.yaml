services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: estudo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-administrador-local}
      BANCO_SENHA: ${BANCO_SENHA:-estudo-local}
    volumes:
      - dados-estudo:/var/lib/postgresql/data
      - ./src/main/resources/banco/questao.sql:/docker-entrypoint-initdb.d/01-tabela.sql:ro
      - ./docker/inicializar-estudo.sql:/docker-entrypoint-initdb.d/02-estudo.sql:ro
      - ./docker/questoes-para-estudo.sql:/docker-entrypoint-initdb.d/03-questoes.sql:ro
      - ./docker/habilitar-cadastro.sql:/docker-entrypoint-initdb.d/04-cadastro.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "estudo"]
      interval: 3s
      timeout: 3s
      retries: 30

  mcp-inspector:
    build: .
    volumes:
      - dados-desempenho:/home/node/.mcp-estudos
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6274:6274"
    environment:
      # Uso local sem token; mantenha a porta publicada apenas em 127.0.0.1.
      DANGEROUSLY_OMIT_AUTH: "true"
      BANCO_URL: jdbc:postgresql://postgres:5432/estudo
      BANCO_USUARIO: leitor_estudo
      DESEMPENHO_ARQUIVO: /home/node/.mcp-estudos/desempenho.json
      BANCO_SENHA: ${BANCO_SENHA:-estudo-local}
    # O Inspector repassa explicitamente as variáveis ao processo STDIO.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec mcp-inspector --web
        -e "BANCO_URL=$$BANCO_URL"
        -e "BANCO_USUARIO=$$BANCO_USUARIO"
        -e "BANCO_SENHA=$$BANCO_SENHA"
        -e "DESEMPENHO_ARQUIVO=$$DESEMPENHO_ARQUIVO"
        java -jar /opt/mcp/server/mcp_server01_server.jar

volumes:
  dados-estudo:
  dados-desempenho:
